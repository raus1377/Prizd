name: Sync data and publish opportunity board
on:
  push:
    branches: [main]
  schedule:
    # 07:17 Asia/Kolkata (01:47 UTC), approximately; hosted jobs may be delayed.
    - cron: '47 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: open-call-sync-and-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Process inbox and archive expired entries
        run: npm run sync
      - name: Check and test
        run: npm run check && npm test
      - name: Build updated website
        run: npm run build
      - name: Commit generated catalog changes
        run: |
          git config user.name "open-call-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/organizers.json data/opportunities data/archive updates/inbox dist
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize opportunities and archive expired listings"
            git push origin HEAD:main
          fi
      # Deploy in THIS run. GITHUB_TOKEN commits don't trigger another workflow.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
